name: Generate Koi

on:
  schedule:
    - cron: '5 0 * * *' # Runs daily just after midnight UTC
  workflow_dispatch:     # Allows manual triggering from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: yalongwastaken/git-koi@v1
        with:
          # Optional coat color: 'white', 'black', 'asagi', 'tea', 'gold', or 'platinum'
          body: 'white'

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update git-koi artwork" && git push)
